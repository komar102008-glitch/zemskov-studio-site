<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0a"><meta name="description" content="Никита — Zemskov studio. Знакомство через цветок: о создании сайтов, творчестве и планах.">
<title>Zemskov studio — раскрыть историю</title>
<link rel="stylesheet" href="cinema.css">
<link rel="preload" as="image" href="flower-bud.webp">
<script src="cinema.js" defer></script>
</head>
<body>
<header class="masthead"><a class="brand" href="#" aria-label="Zemskov studio — начало">Zemskov <span>studio</span><i aria-hidden="true"></i></a><span class="edition">Личное портфолио / Никита</span><button class="plain intro-skip" type="button">Пропустить вступление</button></header>
<main>
 <section class="experience" aria-label="Знакомство через цветок">
  <div class="scene">
   <div class="spotlight" aria-hidden="true"></div>
   <div class="flower" data-state="loading">
    <div class="flower-art" aria-hidden="true">
     <img class="stem" src="flower-stem.webp" width="900" height="960" alt="" fetchpriority="high">
     <div class="petals"></div>
     <img class="heart" src="flower-heart.webp" width="160" height="160" alt="">
     <img class="bud" src="flower-bud.webp" width="900" height="960" alt="" fetchpriority="high">
    </div>
    <svg class="hit-map" viewBox="0 0 600 640" role="group" aria-label="Разделы сайта"></svg>
    <div class="petal-titles" aria-hidden="true"></div>
    <button class="center-control" type="button" aria-label="Раскрыть цветок" aria-expanded="false"><span class="sr-only">Раскрыть цветок</span></button>
   </div>
   <p class="scene-hint" aria-live="polite">Сейчас раскроется.</p>
  </div>
  <div class="opening-copy"><p class="eyebrow">Никита / Zemskov studio</p><h1>Создаю сайты.</h1><p>Меня вдохновляет творчество.<br>И возможность помочь людям<br>рассказать о своём продукте.</p></div>
  <aside class="story" aria-labelledby="story-title" hidden>
   <div class="story-top"><span class="story-count">01 / 06</span><button class="story-close plain" type="button">К цветку <span aria-hidden="true">×</span></button></div>
   <div class="story-body" aria-live="polite" aria-atomic="true"><h2 id="story-title"></h2><p class="story-copy"></p><p class="story-detail"></p></div>
   <nav class="story-nav" aria-label="Разделы знакомства"></nav>
  </aside>
  <div class="quiet-note"><span class="note-line" aria-hidden="true"></span><p>Один цветок.<br>Шесть точек знакомства.</p></div>
 </section>
</main>
<footer><span>Zemskov studio <span class="year">2026</span></span><p class="footer-hint">Выберите лепесток, чтобы познакомиться.</p><button class="plain collapse-control" type="button" disabled>Свернуть цветок</button></footer>
<noscript><p class="no-js">Я Никита. Создаю сайты и хочу помогать людям продвигать свои продукты. Для знакомства через цветок включите JavaScript.</p></noscript>
</body>
</html>
